<text x="170.0" y="28.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">C test program</text>
<text x="170.0" y="43.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">tb/verilator/c_tests/&lt;test&gt;.c → +sram=</text>
<text x="170.0" y="57.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">boot_rom.S → +rom= · check() → UART0</text>
<text x="170.0" y="71.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">riscv64-unknown-elf-gcc</text>
