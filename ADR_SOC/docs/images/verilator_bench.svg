<text x="555.0" y="35.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">tb_top</text>
<text x="555.0" y="50.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">clock and reset · JTAG debugger (+jtag_test)</text>
<text x="555.0" y="64.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">[TOP] VERDICT: PASS / FAIL</text>
