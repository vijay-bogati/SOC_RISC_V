<text x="940.0" y="28.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">Makefile</text>
<text x="940.0" y="43.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">make sim / make regress</text>
<text x="940.0" y="57.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">results/&lt;sim&gt;/&lt;test&gt;/sim.log</text>
<text x="940.0" y="71.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">summary: test, PASS/FAIL, cycles</text>
<rect x="40" y="150" width="1030" height="92" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/>
<text x="555.0" y="186.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">DUT: adr_soc_top (RTL, or the Yosys gate netlist with NETLIST=1)</text>
<text x="555.0" y="201.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">CVA6 boots from the boot ROM, runs the test from SRAM, programs the blocks through their registers and checks the results itself</text>
<text x="555.0" y="215.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">UART0 · UART1 · GPIO · PWM · SPI · QSPI · I2C · Ethernet SerDes · USB · ADC · OTP · JTAG · boot pins</text>
<rect x="40" y="300" width="150" height="92" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
