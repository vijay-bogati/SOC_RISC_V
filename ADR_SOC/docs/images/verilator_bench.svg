<text x="445.0" y="365.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">device at 0x50</text>
<rect x="535" y="300" width="150" height="92" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
