<text x="610.0" y="344.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">full speed</text>
<text x="610.0" y="358.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">reset, SOF, SETUP,</text>
<text x="610.0" y="372.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">OUT, IN</text>
<rect x="700" y="300" width="150" height="92" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
