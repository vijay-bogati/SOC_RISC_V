<text x="115.0" y="344.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">prints the log</text>
<text x="115.0" y="358.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">EOT / NAK → RESULT</text>
<text x="115.0" y="372.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">cycle count, timeout</text>
