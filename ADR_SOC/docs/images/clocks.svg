<text x="662.0" y="154.2" font-family="Liberation Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">UART1, SPI, QSPI, I2C, PWM,</text>
<text x="662.0" y="169.2" font-family="Liberation Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">GPIO, Timer, AES, ADC</text>
