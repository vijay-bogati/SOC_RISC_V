<text x="527.0" y="283.7" font-family="Liberation Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">Two-stage synchronizer and edge detector, in each of the CLINT (mtime) and the always-on timer</text>
