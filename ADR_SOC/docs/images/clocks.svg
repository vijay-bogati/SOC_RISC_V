<text x="297.0" y="154.2" font-family="Liberation Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">cells, enabled by</text>
<text x="297.0" y="169.2" font-family="Liberation Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">CLK_EN bits 0 to 10</text>
