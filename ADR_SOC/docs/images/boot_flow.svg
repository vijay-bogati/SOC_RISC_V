<text x="437.5" y="173.7" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">In simulation only: the testbench loads the SRAM image at time zero.</text>
<text x="437.5" y="188.7" font-family="Liberation Sans, Arial, sans-serif" font-size="11" text-anchor="middle" fill="#1f2937">The boot ROM has no loader yet, so a real chip could not boot with it. BOOT_PINS can be read, but nothing acts on it.</text>
