<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 250" width="820" height="250">
<rect width="820" height="250" fill="#ffffff"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#1f2937"/></marker></defs>
<rect x="200" y="14" width="420" height="220" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-dasharray="5,3"/>
<text x="210" y="32" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">adr_pinmux (one 3-to-1 mux per pad, 16 pads)</text>
<rect x="220" y="50" width="160" height="80" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="300.0" y="73.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">SEL registers</text>
<text x="300.0" y="88.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">PADS_LO: pads 0-7</text>
<text x="300.0" y="102.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">PADS_HI: pads 8-15</text>
<text x="300.0" y="116.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">2 bits per pad</text>
<rect x="420" y="60" width="180" height="140" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<text x="510.0" y="99.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">Output mux</text>
<text x="510.0" y="114.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">sel 0 or 3: GPIO</text>
<text x="510.0" y="128.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">sel 1: function 1</text>
<text x="510.0" y="142.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">sel 2: function 2</text>
<text x="510.0" y="156.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">out and dir both</text>
<text x="510.0" y="170.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">selected</text>
<polyline points="20,90 218,90" fill="none" stroke="#1f2937" stroke-width="1.3" marker-start="url(#b)" marker-end="url(#a)"/>
<text x="24" y="82" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2937">APB</text>
<polyline points="380,100 418,100" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
<polyline points="20,150 418,150" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
<text x="24" y="142" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2937">gpio_out_i, gpio_dir_i (GPIO core)</text>
<polyline points="20,175 418,175" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
<text x="24" y="167" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2937">func1_out_i, func1_dir_i (PWM)</text>
<polyline points="20,200 418,200" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
<text x="24" y="192" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2937">func2_out_i, func2_dir_i (UART1, SPI)</text>
<polyline points="600,130 800,130" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
<text x="640" y="122" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2937">pad_out_o[15:0]</text>
<polyline points="600,160 800,160" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
<text x="640" y="152" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2937">pad_dir_o[15:0]</text>
<text x="640" y="182" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7280">to gpio_out_o / gpio_dir_o pins</text>
<text x="640" y="196" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7280">pad inputs bypass the mux</text>
</svg>
