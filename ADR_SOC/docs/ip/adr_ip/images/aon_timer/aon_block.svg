<polyline points="415,120 415,148" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
<polyline points="480,185 498,185" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
<polyline points="800,85 622,85" fill="none" stroke="#1f2937" stroke-width="1.3" marker-start="url(#b)" marker-end="url(#a)"/>
<text x="700" y="77" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2937">APB</text>
