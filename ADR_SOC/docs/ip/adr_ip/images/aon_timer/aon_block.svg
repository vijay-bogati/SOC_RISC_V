<text x="660" y="177" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2937">irq_o: PLIC 26</text>
<text x="20" y="200" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7280">clk_i: system clock, not gated</text>
<text x="20" y="214" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7280">por_rst_ni: power-on reset only</text>
