<rect x="170" y="14" width="470" height="230" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-dasharray="5,3"/>
<text x="180" y="32" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">adr_aon_timer (power-on reset domain)</text>
<rect x="190" y="50" width="130" height="70" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/>
<text x="255.0" y="75.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">RTC sync</text>
<text x="255.0" y="90.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">2 flops + edge</text>
<text x="255.0" y="104.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">detect: tick</text>
<rect x="350" y="50" width="130" height="70" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<text x="415.0" y="75.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">64-bit counter</text>
<text x="415.0" y="90.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">+1 per tick</text>
<text x="415.0" y="104.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">while enabled</text>
<rect x="350" y="150" width="130" height="70" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text x="415.0" y="175.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">Compare</text>
<text x="415.0" y="190.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">COUNT == CMP</text>
<text x="415.0" y="204.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">at a tick</text>
<rect x="500" y="150" width="120" height="70" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="560.0" y="175.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">match_q</text>
<text x="560.0" y="190.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">STATUS.match</text>
<text x="560.0" y="204.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">W1C</text>
<rect x="500" y="50" width="120" height="70" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="560.0" y="75.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">Registers</text>
<text x="560.0" y="90.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">CTRL, COUNT,</text>
<text x="560.0" y="104.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">CMP, STATUS</text>
<polyline points="20,85 188,85" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
