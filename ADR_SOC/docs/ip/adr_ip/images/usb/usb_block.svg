<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" width="880" height="330">
<rect width="880" height="330" fill="#ffffff"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#1f2937"/></marker></defs>
<rect x="140" y="14" width="600" height="300" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-dasharray="5,3"/>
<text x="150" y="32" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">adr_usb</text>
<rect x="160" y="50" width="150" height="110" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="235.0" y="81.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">APB to TL-UL</text>
<text x="235.0" y="96.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">4-state FSM</text>
<text x="235.0" y="110.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">32-bit word access</text>
<text x="235.0" y="124.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">PREADY when the</text>
<text x="235.0" y="138.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">response returns</text>
<rect x="160" y="190" width="150" height="50" rx="5" fill="#f3f4f6" stroke="#6b7280" stroke-width="1.4"/>
<text x="235.0" y="212.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">tlul_cmd_intg_gen</text>
<text x="235.0" y="227.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">bus integrity bits</text>
<rect x="350" y="50" width="150" height="110" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text x="425.0" y="88.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">tlul_fifo_async</text>
<text x="425.0" y="103.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">request and response</text>
<text x="425.0" y="117.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">FIFOs, 4 deep</text>
<text x="425.0" y="131.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">clk_i &lt;-&gt; usb_clk_i</text>
<rect x="540" y="40" width="180" height="230" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<text x="630.0" y="96.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">usbdev (OpenTitan)</text>
<text x="630.0" y="111.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">registers 0x000-0x0A8</text>
<text x="630.0" y="125.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">packet buffer 2 KiB</text>
<text x="630.0" y="139.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">at 0x800: 32 x 64 B</text>
<text x="630.0" y="153.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">12 endpoints</text>
<text x="630.0" y="167.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">full-speed SIE and</text>
<text x="630.0" y="181.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">PHY logic</text>
<text x="630.0" y="195.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">18 interrupts</text>
<text x="630.0" y="209.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937"></text>
<text x="630.0" y="223.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">runs on usb_clk_i</text>
<polyline points="20,100 158,100" fill="none" stroke="#1f2937" stroke-width="1.3" marker-start="url(#b)" marker-end="url(#a)"/>
<text x="24" y="92" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2937">APB (wait states)</text>
<polyline points="235,160 235,188" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
<polyline points="310,215 330,215 330,120 348,120" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
<polyline points="310,80 348,80" fill="none" stroke="#1f2937" stroke-width="1.3" marker-start="url(#b)" marker-end="url(#a)"/>
<polyline points="500,100 538,100" fill="none" stroke="#1f2937" stroke-width="1.3" marker-start="url(#b)" marker-end="url(#a)"/>
<polyline points="720,90 860,90" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
<text x="726" y="82" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2937">dp_o, dp_en_o, dn_o, dn_en_o</text>
<polyline points="860,130 722,130" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
<text x="726" y="122" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2937">dp_i, dn_i, sense_i</text>
<polyline points="720,170 860,170" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
<text x="726" y="162" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2937">dp_pullup_o, dn_pullup_o</text>
<polyline points="540,250 100,250" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
<text x="20" y="244" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2937">irq_o = OR of 18: PLIC 28</text>
<text x="20" y="290" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7280">clk_i / rst_ni: APB side; usb_clk_i / usb_rst_ni: everything else (48 MHz)</text>
</svg>
