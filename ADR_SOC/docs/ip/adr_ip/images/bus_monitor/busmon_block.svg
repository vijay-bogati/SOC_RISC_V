<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 300" width="840" height="300">
<rect width="840" height="300" fill="#ffffff"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#1f2937"/></marker></defs>
<rect x="200" y="14" width="450" height="270" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-dasharray="5,3"/>
<text x="210" y="32" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">adr_bus_monitor</text>
<rect x="220" y="44" width="180" height="80" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text x="310.0" y="67.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">Error capture</text>
<text x="310.0" y="82.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">STATUS read bits [3:0]</text>
<text x="310.0" y="96.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">STATUS write bits [7:4]</text>
<text x="310.0" y="110.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">sticky, W1C</text>
<rect x="220" y="150" width="180" height="80" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<text x="310.0" y="173.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">First-error address</text>
<text x="310.0" y="188.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">lowest initiator wins,</text>
<text x="310.0" y="202.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">read before write;</text>
<text x="310.0" y="216.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">only when STATUS was 0</text>
<rect x="440" y="44" width="190" height="80" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="535.0" y="67.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">Register interface</text>
<text x="535.0" y="82.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">STATUS, ADDR_LO, ADDR_HI,</text>
<text x="535.0" y="96.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">IRQ_EN</text>
<text x="535.0" y="110.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">PREADY = 1, PSLVERR = 0</text>
<rect x="440" y="170" width="190" height="50" rx="5" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.4"/>
<text x="535.0" y="192.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">irq_o</text>
<text x="535.0" y="207.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">any STATUS bit AND IRQ_EN</text>
<polyline points="20,70 218,70" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
<text x="24" y="62" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2937">read_error_i[3:0]</text>
