<text x="24" y="162" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2937">last_read_addr_i[3:0][63:0]</text>
<polyline points="20,205 218,205" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
<text x="24" y="197" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2937">last_write_addr_i[3:0][63:0]</text>
<polyline points="310,124 310,148" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
<polyline points="400,84 438,84" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
<polyline points="400,190 420,190 420,110 438,110" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
<polyline points="820,84 632,84" fill="none" stroke="#1f2937" stroke-width="1.3" marker-start="url(#b)" marker-end="url(#a)"/>
<text x="700" y="76" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2937">APB</text>
<polyline points="632,195 820,195" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
<text x="700" y="187" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2937">PLIC source 21</text>
<text x="20" y="250" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7280">from adr_interconnect: one bit per crossbar initiator</text>
<text x="20" y="264" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7280">0 CPU, 1 debug module, 2 DMA, 3 Ethernet</text>
</svg>
