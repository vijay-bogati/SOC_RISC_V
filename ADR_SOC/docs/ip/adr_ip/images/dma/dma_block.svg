<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 330" width="860" height="330">
<rect width="860" height="330" fill="#ffffff"/>
<defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 z" fill="#1f2937"/></marker><marker id="b" markerWidth="8" markerHeight="8" refX="1" refY="4" orient="auto"><path d="M8,0 L0,4 L8,8 z" fill="#1f2937"/></marker></defs>
<rect x="150" y="14" width="540" height="300" rx="6" fill="#f9fafb" stroke="#6b7280" stroke-dasharray="5,3"/>
<text x="160" y="32" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="start" fill="#1f2937" font-weight="bold">adr_dma</text>
<rect x="170" y="44" width="170" height="120" rx="5" fill="#dbeafe" stroke="#2563eb" stroke-width="1.4"/>
<text x="255.0" y="73.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">Channel registers x4</text>
<text x="255.0" y="88.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">SRC, DST (64-bit)</text>
<text x="255.0" y="102.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">LEN (24-bit)</text>
<text x="255.0" y="116.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">CTRL, STATUS</text>
<text x="255.0" y="130.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">pending / active / done /</text>
<text x="255.0" y="144.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">error / irq_en</text>
<rect x="170" y="190" width="170" height="60" rx="5" fill="#fef3c7" stroke="#b45309" stroke-width="1.4"/>
<text x="255.0" y="217.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">Round-robin arbiter</text>
<text x="255.0" y="232.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">one transfer at a time</text>
<rect x="380" y="60" width="180" height="130" rx="5" fill="#dcfce7" stroke="#15803d" stroke-width="1.4"/>
<text x="470.0" y="94.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">axi_cdma</text>
<text x="470.0" y="109.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">verilog-axi, unmodified</text>
<text x="470.0" y="123.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">64-bit data, unaligned</text>
<text x="470.0" y="137.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">bursts up to 8 beats</text>
<text x="470.0" y="151.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">read then write</text>
<text x="470.0" y="165.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">status: tag + error</text>
<rect x="380" y="220" width="180" height="70" rx="5" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.4"/>
<text x="470.0" y="245.5" font-family="Liberation Sans, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#1f2937" font-weight="bold">Read credit</text>
<text x="470.0" y="260.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">at most 12 beats read</text>
<text x="470.0" y="274.5" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="middle" fill="#1f2937">but not yet written</text>
<polyline points="20,100 168,100" fill="none" stroke="#1f2937" stroke-width="1.3" marker-start="url(#b)" marker-end="url(#a)"/>
