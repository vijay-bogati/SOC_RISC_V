<polyline points="470,190 470,218" fill="none" stroke="#1f2937" stroke-width="1.3" marker-start="url(#b)" marker-end="url(#a)"/>
<polyline points="560,110 840,110" fill="none" stroke="#1f2937" stroke-width="1.3" marker-start="url(#b)" marker-end="url(#a)"/>
<text x="580" y="102" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2937">AXI4 initiator 2 (AR, R, AW, W, B)</text>
<polyline points="380,170 350,170 350,150 342,150" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
<text x="344" y="184" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2937">status</text>
<polyline points="340,60 600,60 600,250 840,250" fill="none" stroke="#1f2937" stroke-width="1.3" marker-end="url(#a)"/>
<text x="700" y="242" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#1f2937">irq_o: PLIC 22</text>
<text x="20" y="300" font-family="Liberation Sans, Arial, sans-serif" font-size="10" text-anchor="start" fill="#6b7280">clk_i: system clock, not gated; engine uses a synchronous reset</text>
</svg>
